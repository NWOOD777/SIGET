<dialog id="confirmacion-operacion" class="confirmacion-modal" aria-labelledby="confirmacion-titulo" aria-describedby="confirmacion-pregunta confirmacion-ayuda">
    <div class="confirmacion-contenido">
        <div class="confirmacion-icono" aria-hidden="true">✓</div>
        <h2 id="confirmacion-titulo">Revisar y confirmar</h2>
        <p id="confirmacion-pregunta"></p>
        <dl id="confirmacion-resumen" class="confirmacion-resumen"></dl>
        <p id="confirmacion-ayuda" class="confirmacion-ayuda">Revise los datos antes de continuar. Si cancela, podrá seguir editando el formulario.</p>
        <div class="confirmacion-acciones">
            <button type="button" id="confirmacion-cancelar" class="confirmacion-boton confirmacion-secundario" autofocus>Cancelar</button>
            <button type="button" id="confirmacion-aceptar" class="confirmacion-boton confirmacion-primario">Confirmar</button>
        </div>
    </div>
</dialog>
